plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
  namespace 'com.secretaf.app'
  compileSdk 34
  defaultConfig {
    applicationId 'com.secretaf.app'
    minSdk 24
    targetSdk 34
    versionCode 371
    versionName '3.7.1'
    ndk { abiFilters 'arm64-v8a' } // chỉ arm64: máy Android đời mới, APK nhẹ hơn
    externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } }
  }
  externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
  sourceSets { main { jniLibs.srcDirs = ['libnode/bin/'] } }
  packagingOptions { jniLibs { useLegacyPackaging = true } }
  aaptOptions { noCompress 'zip' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
  signingConfigs { release { storeFile file('../tools/secretaf.keystore'); storePassword 'secretaf'; keyAlias 'secretaf'; keyPassword 'secretaf' } }
  buildTypes { release { signingConfig signingConfigs.release; minifyEnabled true; shrinkResources true; proguardFiles 'proguard-rules.pro' } }
}
dependencies { implementation 'androidx.core:core-ktx:1.13.1'; implementation 'androidx.appcompat:appcompat:1.7.0' }
