name: build-apk
on:
  workflow_dispatch: {}
  push: { branches: [main] }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Cài thư viện Node cho lõi
        run: cd nodejs-project && npm install --omit=dev --no-audit --no-fund
      - name: Chuẩn bị (nén lõi + tải libnode)
        run: bash tools/prepare.sh
      - name: Android SDK/NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleRelease --no-daemon
      - name: Đổi tên APK
        run: cp app/build/outputs/apk/release/*.apk Secret-AF.apk
      - uses: actions/upload-artifact@v4
        with: { name: Secret-AF-apk, path: Secret-AF.apk }
      - name: Đăng APK lên Releases (tải trực tiếp trên điện thoại)
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Secret-AF (APK mới nhất)" --notes "Tải Secret-AF.apk rồi cài (cho phép cài từ nguồn không rõ)."
          gh release upload apk-latest Secret-AF.apk --clobber
