name: build-apk
on:
  workflow_dispatch: {}
  push: { branches: [main] }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Cài thư viện Node cho lõi
        run: cd nodejs-project && npm install --omit=dev --no-audit --no-fund
      - name: Chuẩn bị (nén + tải libnode)
        run: bash tools/prepare.sh
      - name: Android SDK/NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug --no-daemon
      - name: Kiểm tra lib trong APK
        run: |
          unzip -l app/build/outputs/apk/debug/*.apk | grep -E "lib/.*/(libnode|libc\+\+_shared|libnative-lib)\.so"
          unzip -l app/build/outputs/apk/debug/*.apk | grep -q "lib/arm64-v8a/libc++_shared.so"
      - uses: actions/upload-artifact@v4
        with:
          name: Secret-AF-apk
          path: app/build/outputs/apk/debug/*.apk
